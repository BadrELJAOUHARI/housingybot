name: Manual listing monitor

# Intentionally no schedule: activation must be a conscious operator choice.
on:
  workflow_dispatch: {}

permissions:
  contents: write  # Required only for committing deduplication state after a manual run.

concurrency:
  group: manual-listing-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Create operator-owned configuration
        env:
          SITE_CONFIG_JSON: ${{ secrets.SITE_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          value = os.getenv('SITE_CONFIG_JSON', '')
          if not value:
              raise SystemExit('Set SITE_CONFIG_JSON before running this workflow')
          Path('config.json').write_text(value, encoding='utf-8')
          PY
      - name: Run one compliant listing check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py
      - name: Store non-personal deduplication state
        if: always()
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen.json
            git commit -m "Update monitor state [skip ci]"
            git push
          fi
